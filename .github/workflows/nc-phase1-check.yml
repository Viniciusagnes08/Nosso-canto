name: Nosso Canto 2.0 - Integracao

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - improve/experiencias-sync-media-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Bundle
        run: npm run build
      - name: Syntax
        run: |
          node --check assets/app.js
          node --check assets/reels.js
          node --check assets/memory-gallery.js
          node --check assets/music-embed.js
